{% extends 'base.html' %}

{% block title %}БМК Чат | {{ block.super }}{% endblock %}

{% block content %}
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Highlight.js для подсветки кода -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
    /* Сброс отступов для чата */
    main.card {
        padding: 0 !important;
        max-width: 100% !important;
    }

    .chat-layout {
        display: flex;
        height: calc(100vh - 200px);
        min-height: 500px;
        border-radius: 8px;
        overflow: hidden;
    }
    .chat-sidebar {
        width: 300px;
        min-width: 250px;
        border-right: 1px solid #dee2e6;
        background: #f8f9fa;
        overflow-y: auto;
    }
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #fff;
    }
    .chat-header {
        padding: 15px 20px;
        border-bottom: 1px solid #dee2e6;
        background: #fafafa;
    }
    .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #e5ddd5;
    }
    .message-input-area {
        padding: 15px 20px;
        background: #f0f0f0;
        border-top: 1px solid #dee2e6;
    }
    .message-bubble {
        max-width: 70%;
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 12px;
        position: relative;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        word-wrap: break-word;
    }
    .message-sent {
        background: #dcf8c6;
        margin-left: auto;
        border-bottom-right-radius: 4px;
    }
    .message-received {
        background: #fff;
        margin-right: auto;
        border-bottom-left-radius: 4px;
    }
    .message-sender {
        font-size: 12px;
        font-weight: bold;
        color: #2e7d32;
        margin-bottom: 4px;
    }
    .message-time {
        font-size: 11px;
        color: #999;
        text-align: right;
        margin-top: 4px;
    }
    .chat-list-item {
        display: block;
        padding: 12px 15px;
        border-bottom: 1px solid #e9ecef;
        cursor: pointer;
        transition: background 0.2s;
        text-decoration: none;
        color: inherit;
    }
    .chat-list-item:hover {
        background: #e9ecef;
        text-decoration: none;
        color: inherit;
    }
    .chat-list-item.active {
        background: #007bff;
        color: white;
    }
    .chat-list-item.active .text-muted {
        color: rgba(255,255,255,0.7) !important;
    }
    .unread-badge {
        background: #dc3545;
        color: white;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: bold;
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        .chat-layout {
            flex-direction: column;
            height: auto;
            min-height: 100vh;
        }
        .chat-sidebar {
            width: 100%;
            max-height: 200px;
            border-right: none;
            border-bottom: 1px solid #dee2e6;
        }
        .message-bubble {
            max-width: 90%;
        }

    /* Подсветка кода */
    .message-content pre {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 12px 15px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 8px 0;
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.5;
    }
    .message-content pre code {
        background: transparent;
        padding: 0;
        color: inherit;
    }
    .message-content code.inline-code {
        background: #f0f0f0;
        color: #e74c3c;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        font-size: 13px;
    }
    .message-sent .message-content code.inline-code {
        background: rgba(0,0,0,0.1);
    }
    .mention {
        background: #e8f0fe;
        color: #1a73e8;
        padding: 1px 4px;
        border-radius: 4px;
        font-weight: 500;
    }
</style>

<div class="chat-layout">
    <div class="chat-sidebar">
        {% block chat_sidebar %}{% endblock %}
    </div>
    <div class="chat-main">
        {% block chat_main %}{% endblock %}
    </div>
</div>

<script>
// Убираем лишние отступы у card при загрузке страницы чата
document.addEventListener('DOMContentLoaded', function() {
    const mainCard = document.querySelector('main.card');
    if (mainCard) {
        mainCard.style.padding = '0';
        mainCard.style.maxWidth = '100%';
    }
});
</script>
{% endblock %}
