{% extends 'base.html' %}

{% block title %}БМК Чат | {{ block.super }}{% endblock %}

{% block extra_css %}
<style>
    .chat-layout {
        display: flex;
        height: calc(100vh - 160px);
        border: 1px solid #dee2e6;
        border-radius: 8px;
        overflow: hidden;
    }
    .chat-sidebar {
        width: 300px;
        border-right: 1px solid #dee2e6;
        background: #f8f9fa;
        overflow-y: auto;
    }
    .chat-main {
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .chat-header {
        padding: 15px 20px;
        border-bottom: 1px solid #dee2e6;
        background: #fff;
    }
    .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #e5ddd5;
    }
    .message-input-area {
        padding: 15px 20px;
        background: #f0f0f0;
        border-top: 1px solid #dee2e6;
    }
    .message-bubble {
        max-width: 70%;
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 12px;
        position: relative;
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .message-sent {
        background: #dcf8c6;
        margin-left: auto;
        border-bottom-right-radius: 4px;
    }
    .message-received {
        background: #fff;
        margin-right: auto;
        border-bottom-left-radius: 4px;
    }
    .message-sender {
        font-size: 12px;
        font-weight: bold;
        color: #2e7d32;
        margin-bottom: 4px;
    }
    .message-time {
        font-size: 11px;
        color: #999;
        text-align: right;
        margin-top: 4px;
    }
    .chat-list-item {
        cursor: pointer;
        transition: background 0.2s;
    }
    .chat-list-item:hover {
        background: #e9ecef;
    }
    .chat-list-item.active {
        background: #007bff;
        color: white;
    }
    .unread-badge {
        background: #007bff;
        color: white;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-layout">
    <div class="chat-sidebar">
        {% block chat_sidebar %}{% endblock %}
    </div>
    <div class="chat-main">
        {% block chat_main %}{% endblock %}
    </div>
</div>
{% endblock %}
