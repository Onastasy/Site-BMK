{% extends 'admin_panel/base_admin.html' %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6">
            <h5>Основные данные</h5>
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control" value="{{ edit_user.username }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ edit_user.email }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Имя</label>
                <input type="text" name="first_name" class="form-control" value="{{ edit_user.first_name }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Фамилия</label>
                <input type="text" name="last_name" class="form-control" value="{{ edit_user.last_name }}">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="is_active" class="form-check-input" id="is_active" {% if edit_user.is_active %}checked{% endif %}>
                <label class="form-check-label" for="is_active">Активен</label>
            </div>
        </div>
        <div class="col-md-6">
            <h5>Группы (роли)</h5>
            {% for group in all_groups %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="groups" value="{{ group.name }}" id="group_{{ group.id }}"
                       {% if group.name in user_groups %}checked{% endif %}>
                <label class="form-check-label" for="group_{{ group.id }}">
                    {{ group.name }}
                </label>
            </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'admin_users' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
