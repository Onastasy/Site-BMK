{% extends "base.html" %}
{% block title %}Поиск{% endblock %}
{% block content %}
<h1>Поиск по сайту</h1>
<form class="search-big" action="{% url 'search' %}" method="get">
  <input name="q" value="{{ q }}" placeholder="Введите запрос..." />
  <button type="submit">Найти</button>
</form>
{% if not q %}
  <p>Введите запрос.</p>
{% elif not results %}
  <p>Ничего не найдено.</p>
{% else %}
  <ul class="search-results">
    {% for r in results %}
      <li><a href="{{ r.url }}">{{ r.title }}</a><div class="muted">{{ r.snippet }}</div></li>
    {% endfor %}
  </ul>
{% endif %}
{% endblock %}
